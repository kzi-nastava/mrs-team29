<div class="register-page">
  <div class="register-card" data-testid="driver-register-card">
    <h1 class="title">Register driver</h1>
    <p class="subtitle">Admin driver registration</p>

    <div *ngIf="successMessage" class="alert alert-success" data-testid="driver-register-success">
      ✅ {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="alert alert-error" data-testid="driver-register-error">
      ❌ {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!successMessage" data-testid="driver-register-form">

      <div class="form-group">
        <label>First name</label>
        <input formControlName="firstName" data-testid="driver-register-first-name" />
      </div>

      <div class="form-group">
        <label>Last name</label>
        <input formControlName="lastName" data-testid="driver-register-last-name" />
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select formControlName="gender" data-testid="driver-register-gender">
          <option value="">Select gender</option>
          <option value="MALE">Male</option>
          <option value="FEMALE">Female</option>
          <option value="NON_BINARY">Non-binary</option>
          <option value="OTHER">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input formControlName="email" data-testid="driver-register-email" />
      </div>

      <div class="form-group">
        <label>Username</label>
        <input formControlName="username" data-testid="driver-register-username" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" data-testid="driver-register-password" />
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input formControlName="phoneNumber" data-testid="driver-register-phone" />
      </div>

      <hr />

      <div class="form-group">
        <label>Vehicle model</label>
        <input formControlName="vehicleModel" data-testid="driver-register-vehicle-model" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Vehicle type</label>
          <select formControlName="vehicleType" data-testid="driver-register-vehicle-type">
            <option value="STANDARD">Standard</option>
            <option value="VAN">Van</option>
            <option value="LUXURY">Luxury</option>
          </select>
        </div>

        <div class="form-group">
          <label>Seats</label>
          <input type="number" formControlName="seats" data-testid="driver-register-seats" />
        </div>
      </div>

      <div class="form-group">
        <label>Registration plate</label>
        <input formControlName="registrationPlate" data-testid="driver-register-plate" />
      </div>

      <div class="form-row">
        <label>
          <input type="checkbox" formControlName="allowsPets" data-testid="driver-register-allows-pets" />
          Pets allowed
        </label>

        <label>
          <input type="checkbox" formControlName="allowsBabies" data-testid="driver-register-allows-babies" />
          Babies allowed
        </label>
      </div>

      <button class="primary-btn" type="submit" [disabled]="loading" data-testid="driver-register-submit">
        {{ loading ? 'Registering...' : 'Register driver' }}
      </button>
    </form>
  </div>
</div>

<style>
  .alert {
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 5px;
    font-size: 14px;
  }

  .alert-success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }

  .alert-error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
