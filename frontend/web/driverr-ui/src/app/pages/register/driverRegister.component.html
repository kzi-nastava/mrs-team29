<div class="register-page">
  <div class="register-card">
    <h1 class="title">Register driver</h1>
    <p class="subtitle">Admin driver registration</p>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-row">
        <div class="form-group">
          <label>First name</label>
          <input formControlName="firstName" />
        </div>

        <div class="form-group">
          <label>Last name</label>
          <input formControlName="lastName" />
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input formControlName="email" />
      </div>

      <div class="form-group">
        <label>Username</label>
        <input formControlName="username" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" />
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input formControlName="phoneNumber" />
      </div>

      <hr />

      <div class="form-group">
        <label>Vehicle model</label>
        <input formControlName="vehicleModel" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Vehicle type</label>
          <select formControlName="vehicleType">
            <option value="STANDARD">Standard</option>
            <option value="VAN">Van</option>
            <option value="LUXURY">Luxury</option>
          </select>
        </div>

        <div class="form-group">
          <label>Seats</label>
          <input type="number" formControlName="seats" />
        </div>
      </div>

      <div class="form-group">
        <label>Registration plate</label>
        <input formControlName="registrationPlate" />
      </div>

      <div class="form-row">
        <label>
          <input type="checkbox" formControlName="allowsPets" />
          Pets allowed
        </label>

        <label>
          <input type="checkbox" formControlName="allowsBabies" />
          Babies allowed
        </label>
      </div>

      <button class="primary-btn" type="submit">
        Register driver
      </button>
    </form>
  </div>
</div>
