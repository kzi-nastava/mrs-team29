<div class="activation-container">
  <div class="activation-card">
    <h1 class="title">Activate Your Driver Account</h1>
    <p class="subtitle">Set up your password to complete registration</p>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="activate()" *ngIf="activationToken">

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password"
          placeholder="Enter at least 6 characters"
          [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
        />
        <small *ngIf="form.get('password')?.hasError('required') && form.get('password')?.touched" class="error-text">
          Password is required
        </small>
        <small *ngIf="form.get('password')?.hasError('minlength') && form.get('password')?.touched" class="error-text">
          Password must be at least 6 characters
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          id="confirmPassword" 
          type="password" 
          formControlName="confirmPassword"
          placeholder="Confirm your password"
          [class.error]="(form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched) || form.hasError('passwordMismatch')"
        />
        <small *ngIf="form.get('confirmPassword')?.hasError('required') && form.get('confirmPassword')?.touched" class="error-text">
          Please confirm your password
        </small>
        <small *ngIf="form.hasError('passwordMismatch')" class="error-text">
          Passwords do not match
        </small>
      </div>

      <button type="submit" class="primary-btn" [disabled]="form.invalid || loading">
        {{ loading ? 'Activating...' : 'Activate Account' }}
      </button>
    </form>
  </div>
</div>

<style scoped>

}

  border-radius: 10px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
  max-width: 400px;
  width: 100%;
}

.title {
  font-size: 24px;
  font-weight: bold;
  color: #333;
  margin-bottom: 10px;
}

.subtitle {
  color: #666;
  margin-bottom: 30px;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #333;
  font-weight: 500;
}

input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 5px;
  font-size: 14px;
}

input:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

input.error {
  border-color: #dc3545;
}

.error-text {
  color: #dc3545;
  font-size: 12px;
  margin-top: 5px;
  display: block;
}

.alert {
  padding: 12px;
  border-radius: 5px;
  margin-bottom: 20px;
  font-size: 14px;
}

.alert-danger {
  background-color: #f8d7da;
  color: #721c24;
  border: 1px solid #f5c6cb;
}

.alert-success {
  background-color: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
}

.primary-btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: opacity 0.3s;
}

.primary-btn:hover:not(:disabled) {

.primary-btn:disabled {

}
</style>
